bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: <frame_prefix>base_link
    odom_topic: odom
    bt_loop_duration: 10
    # 20ms is not enough headroom on a loaded machine (e.g. multi-robot
    # launch with several RViz instances): the BT times out waiting for
    # compute_path_to_pose / follow_path goal acknowledgement and aborts
    # the whole navigation right after the goal is sent, while the
    # un-acknowledged FollowPath keeps running in controller_server.
    default_server_timeout: 100
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically.
    # IsPathEndNearGoal (this package, issue #28) fails the navigation when
    # NavFn's tolerance search replaced the goal by a point the robot can
    # reach - which, for a cube stuck in the inscribed band, is its own pose.
    plugin_lib_names: ["toio_navigation_is_path_end_near_goal_bt_node"]

    error_code_names:
      - compute_path_error_code
      - smoother_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    # FollowPath (RPP) is the default. FollowPathGraceful is registered next
    # to it so the two can be compared on the same route: pick one with the
    # 'controller' launch argument, or switch at runtime through the BT's
    # ControllerSelector (topic 'controller_selector', transient local).
    # See docs/controllers.md.
    controller_plugins: ["FollowPath", "FollowPathGraceful"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.025
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.005
      # The cube overshoots an in-place turn by about 9 deg after the stop
      # command at 2.0 rad/s (90-110 ms BLE latency, measured), so a 0.1 rad
      # band is passed through and the final heading ends up 8 deg off.
      # 0.15 rad (8.6 deg) lets the checker succeed early enough that the
      # overshoot lands the cube on the heading: 3-6 deg measured.
      yaw_goal_tolerance: 0.15
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.1
      # A fixed lookahead. With velocity scaling the lookahead was
      # desired_linear_vel * lookahead_time = 0.1 * 5.0 = 0.5m, always
      # clipped to max_lookahead_dist (0.15m) - half of the A4 mat - so the
      # cube cut every corner of the planned path. 0.1m is one lookahead of
      # ~3 cube lengths, which still smooths the 5mm-grid path.
      lookahead_dist: 0.1
      min_lookahead_dist: 0.05
      max_lookahead_dist: 0.15
      lookahead_time: 1.0
      # In-place turn speed. The cube keeps turning for 90-110 ms after the
      # stop command (BLE), which at 5.0 rad/s is a 28 deg overshoot and left
      # the final heading 20-26 deg off the goal. At 2.0 rad/s the overshoot
      # is 9 deg and the heading error 3-6 deg (A4 mat measurement); the
      # route time is unchanged. The floor is about 1.7 rad/s, below which
      # the wheels (0.0225 m/s minimum) do not move.
      rotate_to_heading_angular_vel: 2.0
      use_velocity_scaled_lookahead_dist: false
      # Crawl over the last approach_velocity_scaling_dist so the cube lands on
      # the waypoint instead of overshooting it. At the old value 0.1
      # (== desired_linear_vel) approach deceleration was fully masked: the
      # cube reached the goal at full 0.1 m/s and, since one 20 Hz control step
      # moves 0.1/20 = 5 mm == xy_goal_tolerance, it stepped past the 5 mm goal
      # band in a single cycle. With allow_reversing: false it then curved back
      # around and passed through again, hunting across the waypoint several
      # times before general_goal_checker latched. 0.03 m/s is 1.5 mm/step,
      # well inside the tolerance, so the cube settles in one pass. It cannot
      # go lower: the cube's motor takes speed values of 8 and up (about
      # 0.0225 m/s), and 0.02 m/s maps to a value of 7, which does not move
      # the wheels at all (checked on hardware: the cube stopped dead in the
      # approach zone and the progress checker aborted).
      min_approach_linear_velocity: 0.03
      # Matched to the play-mat scale: 0.6m was twice the A4 mat length and
      # larger than the forward local-costmap extent (0.5m), so the controller
      # warned "leading to permanent slowdown" on every launch. 0.05m keeps the
      # deceleration zone within the local costmap.
      approach_velocity_scaling_dist: 0.05
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.1
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.03
      cost_scaling_gain: 0.5
      regulated_linear_scaling_min_radius: 0.075
      regulated_linear_scaling_min_speed: 0.075
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.5
      max_angular_accel: 40.0
      min_distance_to_obstacle: 0.0
      stateful: true
    # Graceful Controller: a smooth pose-following control law (Park &
    # Kuipers) that converges onto the goal pose instead of tracking a carrot,
    # which is expected to land the cube on the 5mm goal band more cleanly
    # than RPP. Candidate for comparison on hardware; the speeds match the
    # RPP configuration above.
    FollowPathGraceful:
      plugin: "nav2_graceful_controller::GracefulController"
      transform_tolerance: 0.1
      # Lookahead of the pose the controller steers to, scaled with the speed
      # between these two. The nav2 defaults (0.25-1.0m) are larger than the
      # mat; 0.05-0.1m matches the RPP lookahead.
      min_lookahead: 0.05
      max_lookahead: 0.1
      # Rotate in place first when the path heading differs by more than
      # initial_rotation_tolerance (rad; RPP rotates from 0.5).
      initial_rotation: true
      initial_rotation_tolerance: 0.5
      # Rotate in place to the final yaw once the position is reached.
      prefer_final_rotation: true
      rotation_scaling_factor: 0.5
      allow_backward: false
      # Control law gains (nav2 defaults).
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.4
      lambda: 2.0
      # Same linear limits as RPP: cruise 0.1 m/s, 0.03 m/s (1.5mm per 20Hz
      # step, and the slowest the cube's motor runs, see
      # min_approach_linear_velocity above) on the final approach, slowing
      # down over the last 0.05m.
      v_linear_min: 0.03
      v_linear_max: 0.1
      v_angular_max: 5.0
      # An in-place turn below about 1.7 rad/s (0.0225 m/s per wheel) does not
      # move the cube; the nav2 default of 0.25 left the initial rotation
      # stalled on hardware. 2.0 rad/s (0.027 m/s per wheel) matches RPP's
      # rotate_to_heading_angular_vel, see there for the overshoot numbers.
      v_angular_min_in_place: 2.0
      slowdown_radius: 0.05



local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: <frame_prefix>base_link
      # map -> base_link comes from the hardware bridge, which is started in
      # a second terminal by hand. The default 60s is not enough to power on
      # the cubes and let BLE connect if RMF was started first, and running
      # out is unrecoverable: activation errors, the lifecycle manager aborts
      # the whole bringup and never retries. See toio_rmf_bringup#6.
      initial_transform_timeout: 300.0
      # A rolling 1x1m window (200x200 cells at 5Hz) is oversized for a
      # play mat that is at most 0.42x0.30m (A3): a non-rolling costmap
      # sized by the static map covers the robot's whole world with a
      # fraction of the cells (60x40 on A4) and automatically follows
      # whichever mat map is loaded.
      rolling_window: false
      resolution: 0.005
      robot_radius: 0.01
      # The real cube body (0.0318 x 0.0318m box centered on the 'center'
      # frame in toio_description) expressed in base_link, which sits
      # 0.0038m ahead of 'center' (base_footprint_joint): x spans
      # -0.0197..+0.0121, y spans +-0.0159. The previous 0.02x0.02m
      # polygon underestimated the cube by 40% (the peer robots already
      # use the real size via footprint_length/width: 0.032).
      footprint: "[ [0.0121, 0.0159], [0.0121, -0.0159], [-0.0197, -0.0159], [-0.0197, 0.0159] ]"
      # The nav2 default padding (0.01 per side = 2/3 of the cube width)
      # is oversized for the play-mat scale.
      footprint_padding: 0.005
      plugins: ["static_layer", "peer_robot_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 30.0
        inflation_radius: 0.05
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      peer_robot_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # An absolute name because a layer-level map_topic is resolved
        # in the namespace of the costmap node (e.g. /toio1/local_costmap).
        # The grid contains the static map plus the peer robots because
        # StaticLayer overwrites the master grid (two static layers can
        # not be combined).
        map_topic: "<robot_namespace>/peer_robots_costmap"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: <frame_prefix>base_link
      # See the local_costmap comment: waiting for the bridge's TF.
      initial_transform_timeout: 300.0
      robot_radius: 0.01
      resolution: 0.005
      # See the local_costmap footprint comment: the real cube body in
      # base_link coordinates.
      footprint: "[ [0.0121, 0.0159], [0.0121, -0.0159], [-0.0197, -0.0159], [-0.0197, 0.0159] ]"
      footprint_padding: 0.005
      track_unknown_space: true
      plugins: ["static_layer", "peer_robot_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # When the plugins list is customized, every layer needs an
      # explicit plugin type (the defaults are only declared for the
      # default plugins list).
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
      peer_robot_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # An absolute name because a layer-level map_topic is resolved
        # in the namespace of the costmap node (e.g. /toio1/global_costmap).
        # The grid contains the static map plus the peer robots because
        # StaticLayer overwrites the master grid (two static layers can
        # not be combined).
        map_topic: "<robot_namespace>/peer_robots_costmap"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 30.0
        inflation_radius: 0.05
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    # GridBased is SmacPlanner2D (issue #31). NavFn's path tracing is capped
    # at 4 x (map width in cells) steps - about 0.6m on the 60-cell A4 map -
    # so any route longer than about twice the mat width came back truncated,
    # and its 0.05m tolerance then passed the truncated end as the goal (the
    # spiral centre was never actually planned to). Smac has no such cap:
    # it plans the full 0.63m spiral route. NavFn stays registered for
    # comparison; select it with the planner_selector topic.
    planner_plugins: ["GridBased", "NavFn"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      # Same meaning as NavFn's tolerance below: a goal blocked by a peer
      # robot still gets a plan to the nearest reachable point within it
      # (checked with a fake peer on the goal: the path ends 3cm above it).
      # Note that the BT's IsPathEndNearGoal only accepts a path end within
      # 0.01m of the goal, so such a substitute is refused before driving.
      tolerance: 0.05
      # 5mm cells on a 0.3 x 0.2m map: nothing to downsample
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # Keeps the path away from the inflated walls as NavFn did
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
    NavFn:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # Matched to the play-mat scale: large enough for the tolerance search
      # to escape a peer robot blocking the goal (peer rectangle half-diagonal
      # ~0.023m + inflation inscribed radius ~0.010m), small enough that the
      # search window stays inside the map (a 0.2 tolerance scanned mostly
      # outside the 0.30x0.20m map, flooding the log with worldToMap errors
      # and letting the robot's own pose win as substitute goal; issue #3).
      tolerance: 0.05
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother", "savitzky_golay_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True
    savitzky_golay_smoother:
      plugin: "nav2_smoother::SavitzkyGolaySmoother"
      window_size: 7
      poly_order: 3
      do_refinement: True
      refinement_num: 2
      enforce_path_inversion: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: map
    global_frame: map
    robot_base_frame: <frame_prefix>base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# Marks the peer robots (other robots on the shared map) as rectangular
# obstacles on the peer_robots_costmap topic, which is consumed by the
# peer_robot_layer of the costmaps. peer_base_frames is set from launch.
peer_robot_costmap_publisher:
  ros__parameters:
    footprint_length: 0.032
    footprint_width: 0.032
    update_rate: 10.0

loopback_simulator:
  ros__parameters:
    base_frame_id: "<frame_prefix>base_footprint"
    odom_frame_id: "<frame_prefix>odom"
    map_frame_id: "map"
    scan_frame_id: "<frame_prefix>base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
