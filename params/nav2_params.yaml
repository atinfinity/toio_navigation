bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: <frame_prefix>base_link
    odom_topic: odom
    bt_loop_duration: 10
    # 20ms is not enough headroom on a loaded machine (e.g. multi-robot
    # launch with several RViz instances): the BT times out waiting for
    # compute_path_to_pose / follow_path goal acknowledgement and aborts
    # the whole navigation right after the goal is sent, while the
    # un-acknowledged FollowPath keeps running in controller_server.
    default_server_timeout: 100
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - smoother_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.025
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.005
      yaw_goal_tolerance: 0.1
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.1
      lookahead_dist: 0.1
      min_lookahead_dist: 0.05
      max_lookahead_dist: 0.15
      lookahead_time: 5.0
      rotate_to_heading_angular_vel: 5.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.1
      # Matched to the play-mat scale: 0.6m was twice the A4 mat length and
      # larger than the forward local-costmap extent (0.5m), so the
      # controller warned "leading to permanent slowdown" on every launch
      # and the robot was always in approach-deceleration mode (currently
      # masked by min_approach_linear_velocity == desired_linear_vel).
      approach_velocity_scaling_dist: 0.05
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.1
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.03
      cost_scaling_gain: 0.5
      regulated_linear_scaling_min_radius: 0.075
      regulated_linear_scaling_min_speed: 0.075
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.5
      max_angular_accel: 40.0
      min_distance_to_obstacle: 0.0
      stateful: true


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: <frame_prefix>base_link
      # A rolling 1x1m window (200x200 cells at 5Hz) is oversized for a
      # play mat that is at most 0.42x0.30m (A3): a non-rolling costmap
      # sized by the static map covers the robot's whole world with a
      # fraction of the cells (60x40 on A4) and automatically follows
      # whichever mat map is loaded.
      rolling_window: false
      resolution: 0.005
      robot_radius: 0.01
      # The real cube body (0.0318 x 0.0318m box centered on the 'center'
      # frame in toio_description) expressed in base_link, which sits
      # 0.0038m ahead of 'center' (base_footprint_joint): x spans
      # -0.0197..+0.0121, y spans +-0.0159. The previous 0.02x0.02m
      # polygon underestimated the cube by 40% (the peer robots already
      # use the real size via footprint_length/width: 0.032).
      footprint: "[ [0.0121, 0.0159], [0.0121, -0.0159], [-0.0197, -0.0159], [-0.0197, 0.0159] ]"
      # The nav2 default padding (0.01 per side = 2/3 of the cube width)
      # is oversized for the play-mat scale.
      footprint_padding: 0.005
      plugins: ["static_layer", "peer_robot_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 30.0
        inflation_radius: 0.05
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      peer_robot_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # An absolute name because a layer-level map_topic is resolved
        # in the namespace of the costmap node (e.g. /toio1/local_costmap).
        # The grid contains the static map plus the peer robots because
        # StaticLayer overwrites the master grid (two static layers can
        # not be combined).
        map_topic: "<robot_namespace>/peer_robots_costmap"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: <frame_prefix>base_link
      robot_radius: 0.01
      resolution: 0.005
      # See the local_costmap footprint comment: the real cube body in
      # base_link coordinates.
      footprint: "[ [0.0121, 0.0159], [0.0121, -0.0159], [-0.0197, -0.0159], [-0.0197, 0.0159] ]"
      footprint_padding: 0.005
      track_unknown_space: true
      plugins: ["static_layer", "peer_robot_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # When the plugins list is customized, every layer needs an
      # explicit plugin type (the defaults are only declared for the
      # default plugins list).
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
      peer_robot_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # An absolute name because a layer-level map_topic is resolved
        # in the namespace of the costmap node (e.g. /toio1/global_costmap).
        # The grid contains the static map plus the peer robots because
        # StaticLayer overwrites the master grid (two static layers can
        # not be combined).
        map_topic: "<robot_namespace>/peer_robots_costmap"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 30.0
        inflation_radius: 0.05
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # Matched to the play-mat scale: large enough for the tolerance search
      # to escape a peer robot blocking the goal (peer rectangle half-diagonal
      # ~0.023m + inflation inscribed radius ~0.010m), small enough that the
      # search window stays inside the map (a 0.2 tolerance scanned mostly
      # outside the 0.30x0.20m map, flooding the log with worldToMap errors
      # and letting the robot's own pose win as substitute goal; issue #3).
      tolerance: 0.05
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother", "savitzky_golay_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True
    savitzky_golay_smoother:
      plugin: "nav2_smoother::SavitzkyGolaySmoother"
      window_size: 7
      poly_order: 3
      do_refinement: True
      refinement_num: 2
      enforce_path_inversion: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: map
    global_frame: map
    robot_base_frame: <frame_prefix>base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# Marks the peer robots (other robots on the shared map) as rectangular
# obstacles on the peer_robots_costmap topic, which is consumed by the
# peer_robot_layer of the costmaps. peer_base_frames is set from launch.
peer_robot_costmap_publisher:
  ros__parameters:
    footprint_length: 0.032
    footprint_width: 0.032
    update_rate: 10.0

loopback_simulator:
  ros__parameters:
    base_frame_id: "<frame_prefix>base_footprint"
    odom_frame_id: "<frame_prefix>odom"
    map_frame_id: "map"
    scan_frame_id: "<frame_prefix>base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
